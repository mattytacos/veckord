name: Bug Report
description: Create a report to help us fix a bug in Deckord
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report!
  - type: input
    id: environment
    attributes:
      label: Operating System / Hardware
      description: What system are you running Deckord on?
      placeholder: e.g. Steam Deck LCD / Bazzite 40 / Fedora Gaming
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug cleanly.
      placeholder: Tell us what went wrong.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log Output
      description: Paste relevant logs from Decky Loader or Vesktop (redact any personal info).
      render: text
